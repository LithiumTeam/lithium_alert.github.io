<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="./LiAlert/minify/LiAlert.min.css">
		<link rel="stylesheet" href="./css/style.css">
		<title>Li Alert</title>
	</head>
	<body>
		<section class="container">
			<div class="header">
				<nav>
					<ul>
						<li><a href="#main">home</a></li>
						<li><a href="#examples">examples</a></li>
						<li><a href>download</a></li>
						<li><a href="https://github.com/LithiumTeam/Li-Alert/blob/main/docs/docs.md" target="__blank">docs</a></li>
					</ul>
					<div class="title">
						<h1>Lithium Alert</h1>
					</div>
				</nav>
			</div>

			<div class="main" id="main">
				<h1 class="title">Lithium Alert</h1>
				<p class="desc">A Javascript Library For Beautiful Alerts!</p>
				<a href="#examples" class="btn_example">see some examples</a>
			</div>
			<div class="examples" id="examples">
				<h1 class="title">Examples</h1>
				<div class="box_list">
					<div class="box">
						<h1 class="title_box">success message</h1>
						<button class="show_alert" id="success_alert">click me</button>
						<button class="source_code">
							<img src="./img/github.png" alt="github"/>
						</button>
					</div>
	
					<div class="box">
						<h1 class="title_box">error message</h1>
						<button class="show_alert" id="error_alert">click me</button>
						<button class="source_code">
							<img src="./img/github.png" alt="github"/>
						</button>
					</div>
	
					<div class="box">
						<h1 class="title_box">success message theme light</h1>
						<button class="show_alert" id="success_alert_light">click me</button>
						<button class="source_code">
							<img src="./img/github.png" alt="github"/>
						</button>
					</div>
	
					<div class="box">
						<h1 class="title_box">error message theme light</h1>
						<button class="show_alert" id="error_alert_light">click me</button>
						<button class="source_code">
							<img src="./img/github.png" alt="github"/>
						</button>
					</div>

				</div>
			 </div>
		</section>
		<script src="./LiAlert/minify/LiAlert.min.js"> </script>
		<script src="./js/script.js"> </script>
	</body>

</html>
